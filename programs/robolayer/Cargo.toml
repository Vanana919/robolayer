[package]
name = "robolayer"
version = "0.1.0"
description = "RoboLayer: Solana execution layer for AI agents and robotics operators."
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "robolayer"

[features]
default = []
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
mainnet = []
zk = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = "0.30.1"
anchor-spl = "0.30.1"
