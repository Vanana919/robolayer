<svg width="1200" height="320" viewBox="0 0 1200 320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0B14"/>
      <stop offset="100%" stop-color="#15152A"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9945FF"/>
      <stop offset="100%" stop-color="#14F195"/>
    </linearGradient>
    <radialGradient id="glowOrb" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#9945FF" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#9945FF" stop-opacity="0"/>
    </radialGradient>
    <filter id="bGlow">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="320" fill="url(#bgGrad)"/>

  <!-- Background grid (subtle) -->
  <g stroke="#23234A" stroke-width="0.5" opacity="0.5">
    <path d="M0 0 L1200 320 M0 320 L1200 0 M0 160 L1200 160 M600 0 L600 320"/>
    <path d="M150 0 L150 320 M300 0 L300 320 M450 0 L450 320 M750 0 L750 320 M900 0 L900 320 M1050 0 L1050 320"/>
    <path d="M0 80 L1200 80 M0 240 L1200 240"/>
  </g>

  <!-- Glow orbs -->
  <ellipse cx="980" cy="160" rx="280" ry="200" fill="url(#glowOrb)"/>
  <ellipse cx="100" cy="60" rx="180" ry="120" fill="url(#glowOrb)" opacity="0.6"/>

  <!-- Logo (left) -->
  <g transform="translate(70 96) scale(0.5)">
    <polygon points="128,28 220,80 220,176 128,228 36,176 36,80"
             fill="none" stroke="url(#accentGrad)" stroke-width="6" filter="url(#bGlow)"/>
    <g transform="translate(128 128)" filter="url(#bGlow)">
      <rect x="-44" y="-32" width="88" height="64" rx="10" fill="none"
            stroke="url(#accentGrad)" stroke-width="4"/>
      <circle cx="-20" cy="0" r="9" fill="#14F195"/>
      <circle cx="20" cy="0" r="9" fill="#9945FF"/>
      <line x1="-22" y1="-32" x2="-22" y2="-52" stroke="url(#accentGrad)" stroke-width="4"/>
      <line x1="22" y1="-32" x2="22" y2="-52" stroke="url(#accentGrad)" stroke-width="4"/>
      <circle cx="-22" cy="-56" r="5" fill="#14F195"/>
      <circle cx="22" cy="-56" r="5" fill="#9945FF"/>
    </g>
  </g>

  <!-- Wordmark + tagline -->
  <text x="220" y="155" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif"
        font-size="78" font-weight="800" fill="#FFFFFF" letter-spacing="-2">
    Robo<tspan fill="url(#accentGrad)">Layer</tspan>
  </text>

  <text x="222" y="200" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif"
        font-size="22" font-weight="500" fill="#A0A0BC" letter-spacing="0.5">
    Execution Layer for Robotics &amp; AI Operators on Solana
  </text>

  <!-- Pills -->
  <g transform="translate(222 232)" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="600">
    <g>
      <rect x="0" y="0" width="86" height="30" rx="15" fill="#9945FF" fill-opacity="0.15" stroke="#9945FF" stroke-opacity="0.5"/>
      <text x="43" y="20" fill="#C8AEFF" text-anchor="middle">⚡ Solana</text>
    </g>
    <g transform="translate(96 0)">
      <rect x="0" y="0" width="86" height="30" rx="15" fill="#14F195" fill-opacity="0.15" stroke="#14F195" stroke-opacity="0.5"/>
      <text x="43" y="20" fill="#7AF5C0" text-anchor="middle">🔒 Staking</text>
    </g>
    <g transform="translate(192 0)">
      <rect x="0" y="0" width="86" height="30" rx="15" fill="#FF6B9D" fill-opacity="0.15" stroke="#FF6B9D" stroke-opacity="0.5"/>
      <text x="43" y="20" fill="#FFB3CC" text-anchor="middle">🧪 ZK</text>
    </g>
    <g transform="translate(288 0)">
      <rect x="0" y="0" width="98" height="30" rx="15" fill="#FFB155" fill-opacity="0.15" stroke="#FFB155" stroke-opacity="0.5"/>
      <text x="49" y="20" fill="#FFD49A" text-anchor="middle">🤖 AI Agents</text>
    </g>
  </g>
</svg>
