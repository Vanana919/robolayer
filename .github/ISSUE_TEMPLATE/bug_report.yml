name: Bug Report
description: Report a reproducible bug
title: "[Bug] "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug report. Please fill out the fields below.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of what the bug is.
      placeholder: When I do X, Y happens instead of Z.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run `forge test`
        2. Submit task with X
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: "v0.2.0 / commit sha"
    validations:
      required: true
  - type: dropdown
    id: network
    attributes:
      label: Network
      options:
        - local (anvil)
        - sepolia
        - base
        - mainnet
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      render: shell
